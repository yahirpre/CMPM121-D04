name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - name: Setup uv (for gdtoolkit lint and format)
        uses: astral-sh/setup-uv@v10.3.3 # it publishes no floating major tag
        with:
          enable-cache: false # nothing to key it on: uvx only fetches the small GDScript linter
      - name: Cache Godot in .tools/
        uses: actions/cache@v6
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/godot.ts') }}
      - name: Download pinned Godot and its web template
        run: deno task setup
      - name: Run CI checks and export the web build
        run: deno task ci
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload web build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
