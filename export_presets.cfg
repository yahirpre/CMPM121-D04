; Export settings, editable by hand. "Web" is the name deno task build uses.
[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
; Non-resource files (text levels, rule files, JSON) are left out of exports unless
; listed here. See the Godot 4.7 docs: Exporting projects, Resource options.
include_filter="levels/*"
exclude_filter="tests/*, tools/*, scripts/*"
export_path="dist/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
progressive_web_app/enabled=false
